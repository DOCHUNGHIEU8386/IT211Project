spring.datasource.url=jdbc:mysql://localhost:3306/it211project
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pagination default
pageSize=5

# JWT Configuration
jwt.secret=mySecretKeymySecretKeymySecretKeymySecretKey
jwt.expiration-ms=86400000
# Refresh token: 7 days
jwt.refresh-expiration-ms=604800000

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Upload directories
upload.submission-dir=uploads/submissions
upload.material-dir=uploads/materials
# ==================== FR-13: Redis Configuration ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# Token Blacklist TTL (milliseconds) - b?ng v?i th?i gian h?t h?n c?a access token
token.blacklist.ttl=86400000